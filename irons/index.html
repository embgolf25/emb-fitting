<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iron Fitting | EMB Fitting</title>
<meta name="description" content="Iron shaft profile, head type and set makeup recommendations from EMB Golf's tour grip, post and biomechanics research.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f8fbf9;--bg3:#f0f7f2;--bg4:#e4f1e8;
  --border:#e1ece5;--border2:#cfe2d6;
  --text:#17261d;--text2:#4b6556;--text3:#7f978a;
  --cyan:#4cb87a;--cyan2:#23794a;--cyan3:#2f8f58;--cyan4:#e3f4ea;
  --teal:#6cc993;--teal2:#2f8f58;--teal3:#d3eedd;
  --red:#d64550;
  --radius:10px;--radius2:14px;
  --font:'Inter',system-ui,sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
.app{display:flex;flex-direction:column;min-height:100vh}
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 28px;display:flex;align-items:center;justify-content:space-between;height:60px;flex-shrink:0;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
.logo{display:flex;align-items:center;gap:12px}
.logo-mark{width:32px;height:32px;background:linear-gradient(135deg,var(--cyan) 0%,var(--teal) 100%);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#0f2a1a;letter-spacing:-0.5px;box-shadow:0 0 16px rgba(76,184,122,0.3)}
.logo-text{font-size:16px;font-weight:700;letter-spacing:0.02em;color:var(--text)}
.logo-sub{font-size:10px;color:var(--text3);letter-spacing:0.15em;text-transform:uppercase;margin-top:1px}
.nav{display:flex;gap:2px}
.nav-btn{background:transparent;border:none;padding:8px 16px;color:var(--text3);font-size:13px;cursor:pointer;border-radius:var(--radius);font-family:var(--font);transition:all 0.15s;font-weight:500}
.nav-btn:hover{color:var(--text);background:var(--bg3)}
.nav-btn.active{color:var(--cyan);background:var(--bg3);box-shadow:inset 0 -2px 0 var(--cyan)}
.nav-btn i{margin-right:6px;font-size:14px;vertical-align:-2px}
.hub-link{display:inline-flex;align-items:center;gap:6px;margin-right:14px;padding:7px 12px;border:1px solid var(--border2);border-radius:var(--radius);font-size:12px;font-weight:600;color:var(--text2);text-decoration:none;background:var(--bg);transition:all 0.15s}
.hub-link:hover{color:var(--cyan2);border-color:var(--cyan);background:var(--bg3)}
.hub-link i{font-size:15px}
.session-badge{font-size:11px;color:var(--text3);letter-spacing:0.05em;text-transform:uppercase}
.db-status{font-size:11px;padding:4px 10px;border-radius:20px;margin-left:10px;font-weight:500}
.db-status.connected{background:rgba(76,184,122,0.1);color:var(--cyan);border:1px solid rgba(76,184,122,0.2)}
.db-status.error{background:rgba(214,69,80,0.1);color:var(--red);border:1px solid rgba(214,69,80,0.2)}
.main{flex:1;overflow-y:auto;}
.sidebar{background:transparent;padding:0 28px;}
.content{padding:0 28px 40px;}
.sidebar-label{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--cyan3);margin-bottom:12px;font-weight:700;display:flex;align-items:center;gap:8px}
.sidebar-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border2),transparent)}
.sidebar-section{margin-bottom:28px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:500}
.field input,.field select{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 12px;color:var(--text);font-size:14px;font-family:var(--font);transition:all 0.15s}
.field input:focus,.field select:focus{outline:none;border-color:var(--cyan3);background:var(--bg4);box-shadow:0 0 0 3px rgba(76,184,122,0.06)}
.field select option{background:var(--bg3)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bio-section-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.bio-section-title span{background:linear-gradient(135deg,var(--cyan),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.bio-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px}
.bio-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius2);padding:16px 18px;transition:border 0.15s;position:relative;overflow:hidden}
.bio-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--cyan),var(--teal));opacity:0.4}
.bio-card:focus-within{border-color:var(--cyan3);box-shadow:0 0 0 3px rgba(76,184,122,0.06)}
.bio-card:focus-within::before{opacity:1}
.bio-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.bio-card-name{font-size:12px;font-weight:600;color:var(--text2);line-height:1.4;flex:1}
.bio-card-unit{font-size:10px;color:var(--cyan3);text-transform:uppercase;letter-spacing:0.08em;background:rgba(76,184,122,0.08);padding:2px 7px;border-radius:4px;white-space:nowrap;margin-left:8px}
.bio-card input{width:100%;background:transparent;border:none;border-bottom:2px solid var(--border2);color:var(--cyan2);font-size:22px;font-weight:700;padding:4px 0;font-family:var(--font);transition:border 0.15s;letter-spacing:-0.02em}
.bio-card input:focus{outline:none;border-color:var(--cyan)}
.bio-card input::placeholder{color:var(--text3);font-size:16px;font-weight:400}
.lm-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:28px}
.lm-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:14px 16px}
.lm-card label{display:block;font-size:11px;color:var(--text3);margin-bottom:8px;font-weight:500;text-transform:uppercase;letter-spacing:0.06em}
.lm-card input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border2);color:var(--text);font-size:18px;font-weight:600;padding:2px 0;font-family:var(--font)}
.lm-card input:focus{outline:none;border-color:var(--cyan3)}
.lm-card input::placeholder{color:var(--border2);font-size:14px;font-weight:400}
.bio-card select{width:100%;background:transparent;border:none;border-bottom:2px solid var(--border2);color:var(--cyan2);font-size:20px;font-weight:700;padding:4px 0;font-family:var(--font);cursor:pointer}
.bio-card select:focus{outline:none;border-color:var(--cyan)}
.lm-card select{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border2);color:var(--text);font-size:17px;font-weight:600;padding:2px 0;font-family:var(--font);cursor:pointer}
.lm-card select:focus{outline:none;border-color:var(--cyan3)}
.lm-card .lm-calc{font-size:18px;font-weight:600;color:var(--text);padding:2px 0;border-bottom:1px dashed var(--border2)}
.lm-card .lm-unit{font-size:10px;color:var(--text3);margin-top:4px}
.chip-group{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:7px 16px;font-size:13px;cursor:pointer;color:var(--text2);font-family:var(--font);transition:all 0.15s;font-weight:500}
.chip:hover{border-color:var(--cyan3);color:var(--text)}
.chip.selected{background:rgba(76,184,122,0.1);border-color:var(--cyan3);color:var(--cyan);box-shadow:0 0 8px rgba(76,184,122,0.15)}
.run-btn{width:100%;background:linear-gradient(135deg,var(--cyan) 0%,var(--teal) 100%);color:#0f2a1a;border:none;border-radius:var(--radius);padding:14px;font-size:14px;font-weight:800;cursor:pointer;letter-spacing:0.08em;text-transform:uppercase;font-family:var(--font);transition:all 0.2s;margin-top:8px;box-shadow:0 4px 20px rgba(76,184,122,0.25)}
.run-btn:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(76,184,122,0.4)}
.run-btn:active{transform:translateY(0)}
.run-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.clear-btn{width:100%;background:transparent;border:1px solid var(--border2);color:var(--text3);border-radius:var(--radius);padding:9px;font-size:12px;cursor:pointer;font-family:var(--font);margin-top:8px;transition:all 0.15s}
.clear-btn:hover{border-color:var(--red);color:var(--red)}
.player-banner{background:linear-gradient(135deg,var(--bg3) 0%,var(--bg2) 100%);border:1px solid var(--border2);border-top:2px solid var(--cyan3);border-radius:var(--radius2);padding:24px 28px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center}
.player-name{font-size:26px;font-weight:800;letter-spacing:-0.03em;margin-bottom:6px;background:linear-gradient(135deg,var(--text) 0%,var(--text2) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.player-meta{font-size:13px;color:var(--text2)}
.player-stats{display:flex;gap:28px}
.stat-block{text-align:right}
.stat-val{font-size:24px;font-weight:800;color:var(--cyan);line-height:1;letter-spacing:-0.02em}
.stat-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;margin-top:4px}
.rules-strip{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--cyan);border-radius:var(--radius);padding:14px 18px;margin-bottom:20px}
.rules-strip-title{font-size:10px;text-transform:uppercase;letter-spacing:0.14em;color:var(--cyan);margin-bottom:10px;font-weight:700}
.rule-item{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--text2);margin-bottom:6px;line-height:1.6}
.rule-item:last-child{margin-bottom:0}
.rule-item i{color:var(--cyan);flex-shrink:0;margin-top:2px}
.section-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;margin-top:4px}
.zone-block{margin-bottom:36px}
.zone-header{display:flex;align-items:center;gap:10px;margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid var(--border2)}
.zone-header i{font-size:18px;color:var(--cyan)}
.zone-header-title{font-size:15px;font-weight:800;color:var(--text);letter-spacing:0.02em}
.zone-header-sub{font-size:11px;color:var(--text3);margin-left:auto}
.analysis-toggle-bar{display:flex;align-items:center;justify-content:space-between;cursor:pointer;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius2);padding:14px 18px;margin-bottom:0;transition:border 0.15s}
.analysis-toggle-bar:hover{border-color:var(--cyan3)}
.analysis-toggle-left{display:flex;align-items:center;gap:10px}
.analysis-toggle-left i{font-size:16px;color:var(--cyan)}
.analysis-toggle-title{font-size:13px;font-weight:700;color:var(--text)}
.analysis-toggle-chevron{transition:transform 0.2s;color:var(--text3)}
.analysis-toggle-chevron.open{transform:rotate(180deg)}
.analysis-body{overflow:hidden;max-height:0;transition:max-height 0.25s ease}
.analysis-body.open{max-height:3000px}
.analysis-body-inner{padding-top:20px}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:0.15em;color:var(--text3);font-weight:700;white-space:nowrap}
.section-line{flex:1;height:1px;background:linear-gradient(90deg,var(--border2),transparent)}
.rec-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
.rec-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:20px;cursor:default;transition:border 0.15s}
.rec-card.top-pick{border-color:var(--cyan3);background:linear-gradient(135deg,rgba(76,184,122,0.04) 0%,var(--bg2) 100%);box-shadow:0 0 24px rgba(76,184,122,0.06)}
.rec-rank{font-size:10px;text-transform:uppercase;letter-spacing:0.12em;color:var(--text3);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.rec-rank .cyan-dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);flex-shrink:0;box-shadow:0 0 6px var(--cyan)}
.rec-card.top-pick .rec-rank{color:var(--cyan)}
.rec-name{font-size:15px;font-weight:700;margin-bottom:12px;line-height:1.3;color:var(--text)}
.rec-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tag{background:var(--bg4);border:1px solid var(--border2);border-radius:5px;padding:4px 9px;font-size:11px;color:var(--text2)}
.tag.highlight{background:rgba(76,184,122,0.08);border-color:var(--cyan3);color:var(--cyan)}
.rec-why{font-size:12px;color:var(--text2);line-height:1.7;border-top:1px solid var(--border);padding-top:12px}
.rec-test{font-size:12px;color:var(--teal2);margin-top:10px;display:flex;align-items:flex-start;gap:6px;line-height:1.6}
.confidence-bar{height:3px;background:var(--border2);border-radius:2px;margin-top:14px;overflow:hidden}
.confidence-fill{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--cyan3),var(--cyan2));box-shadow:0 0 6px var(--cyan)}
.ai-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ai-dot{width:8px;height:8px;border-radius:50%;background:var(--teal2);animation:pulse 2s infinite;box-shadow:0 0 8px var(--teal2)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.8)}}
.ai-title{font-size:11px;text-transform:uppercase;letter-spacing:0.12em;color:var(--teal2);font-weight:700}
.spinner{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--cyan);border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block;vertical-align:-3px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;gap:14px;color:var(--text3)}
.empty i{font-size:48px;color:var(--border2)}
.empty-title{font-size:16px;font-weight:600;color:var(--text2)}
.empty-sub{font-size:13px;text-align:center;max-width:300px;line-height:1.7;color:var(--text3)}
.session-list-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:all 0.15s;display:flex;justify-content:space-between;align-items:center}
.session-list-item:hover{border-color:var(--cyan3);background:var(--bg3)}
.session-list-name{font-size:14px;font-weight:600;margin-bottom:4px}
.session-list-meta{font-size:11px;color:var(--text3)}
.admin-lock{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;gap:16px}
.admin-lock-title{font-size:18px;font-weight:700}
.admin-lock-sub{font-size:13px;color:var(--text3)}
.pw-row{display:flex;gap:10px}
.pw-row input{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 16px;color:var(--text);font-size:14px;font-family:var(--font);width:220px}
.pw-row input:focus{outline:none;border-color:var(--cyan3);box-shadow:0 0 0 3px rgba(76,184,122,0.06)}
.pw-btn{background:linear-gradient(135deg,var(--cyan),var(--teal));color:#0f2a1a;border:none;border-radius:var(--radius);padding:10px 20px;font-size:13px;font-weight:800;cursor:pointer;font-family:var(--font)}
.pw-err{font-size:12px;color:var(--red)}
.admin-tabs{display:flex;gap:2px;margin-bottom:24px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.admin-tab{background:transparent;border:none;border-bottom:2px solid transparent;padding:10px 16px;color:var(--text3);font-size:13px;cursor:pointer;font-family:var(--font);margin-bottom:-1px;transition:all 0.15s;font-weight:500}
.admin-tab.active{color:var(--cyan);border-bottom-color:var(--cyan)}
.admin-tab:hover{color:var(--text)}
.admin-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:20px;margin-bottom:14px}
.admin-card-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:5px}
.admin-card-meta{font-size:12px;color:var(--text3);margin-bottom:10px;line-height:1.6}
.admin-card-cond{font-size:11px;color:var(--cyan3);font-family:monospace;background:var(--bg4);padding:4px 10px;border-radius:5px;margin-bottom:10px;display:inline-block;border:1px solid var(--border2)}
.admin-actions{display:flex;gap:8px;margin-top:12px}
.btn-sm{background:transparent;border:1px solid var(--border2);border-radius:var(--radius);padding:5px 12px;font-size:11px;cursor:pointer;color:var(--text2);font-family:var(--font);transition:all 0.15s}
.btn-sm:hover{border-color:var(--text2);color:var(--text)}
.btn-sm.danger:hover{border-color:var(--red);color:var(--red)}
.priority-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin-left:8px}
.priority-badge.high{background:rgba(214,69,80,0.12);color:#d64550;border:1px solid rgba(214,69,80,0.2)}
.priority-badge.medium{background:rgba(255,180,0,0.12);color:#ffb400;border:1px solid rgba(255,180,0,0.2)}
.priority-badge.low{background:rgba(76,184,122,0.12);color:var(--teal2);border:1px solid rgba(76,184,122,0.2)}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:500}
.form-group input,.form-group select,.form-group textarea{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 12px;color:var(--text);font-size:13px;font-family:var(--font);transition:all 0.15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--cyan3);box-shadow:0 0 0 3px rgba(76,184,122,0.06)}
.form-group textarea{resize:vertical;line-height:1.6}
.form-group select option{background:var(--bg3)}
.form-hint{font-size:11px;color:var(--text3);margin-top:5px;line-height:1.6}
.add-btn{background:linear-gradient(135deg,var(--cyan),var(--teal));color:#0f2a1a;border:none;border-radius:var(--radius);padding:11px 22px;font-size:13px;font-weight:800;cursor:pointer;font-family:var(--font);transition:all 0.15s}
.add-btn:hover{box-shadow:0 4px 16px rgba(76,184,122,0.3)}
.add-btn:disabled{opacity:0.4;cursor:not-allowed}
.success-msg{font-size:12px;color:var(--teal2);margin-top:10px}
.error-msg{font-size:12px;color:var(--red);margin-top:10px}
.equip-row{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border)}
.equip-row:last-child{border-bottom:none}
.equip-name{font-size:13px;font-weight:600;margin-bottom:5px}
.equip-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px}
.equip-meta{font-size:11px;color:var(--text3)}
.section-divider{display:flex;align-items:center;gap:10px;margin:20px 0 16px}
.section-divider span{font-size:10px;text-transform:uppercase;letter-spacing:0.14em;color:var(--text3);white-space:nowrap;font-weight:700}
.section-divider::before,.section-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:12px 18px;font-size:13px;color:var(--text);z-index:999;opacity:0;transition:opacity 0.3s;box-shadow:0 8px 32px rgba(23,38,29,0.12)}
.toast.show{opacity:1}
.toast.success{border-color:var(--teal2);color:var(--teal2)}
.toast.error{border-color:var(--red);color:var(--red)}

/* ── Iron fitting additions ── */
:root{--amber-bg:#fdf3dc;--amber-border:#ecd08f;--amber-text:#6b4a06;--green-bg:#d9f1e2;--green-border:#9fd4b4;--green-text:#17603a}
button.analysis-toggle-bar{width:100%;font-family:var(--font);text-align:left;color:var(--text)}
button.analysis-toggle-bar:focus-visible,.chip:focus-visible,.nav-btn:focus-visible,.run-btn:focus-visible,.session-list-item:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.analysis-body.open{max-height:none}
.profile-preview{margin-top:12px;margin-bottom:4px;min-height:22px;font-size:12px}
.profile-num{color:var(--cyan2);font-weight:700}
.profile-desc{color:var(--text3)}
.section-note{font-size:13px;color:var(--text3);margin-bottom:20px;line-height:1.6;max-width:760px}
.other-input,.notes-input{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 12px;color:var(--text);font-size:13px;font-family:var(--font);margin-bottom:14px}
.notes-input{padding:12px 14px;resize:vertical;line-height:1.6;margin-top:12px}
.summary{font-size:13px;color:var(--text2);line-height:2}
.summary-key{color:var(--text3)}
.summary-notes{font-size:12px;color:var(--text2);line-height:1.7}
.player-band{font-size:12px;color:var(--cyan3);margin-top:3px}
.guide{border:1px solid var(--cyan3);background:var(--bg3);border-radius:var(--radius2);padding:18px 20px;margin-bottom:24px}
.guide-label{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--cyan3);font-weight:700}
.guide-text{font-size:22px;font-weight:800;letter-spacing:-0.01em;line-height:1.25;margin-top:4px;color:var(--text)}
.guide-sub{font-size:12px;color:var(--text2);margin-top:6px}
.plain-note{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:20px;max-width:760px}
.plain-note.pad{padding:14px 16px;margin-bottom:0}
.signal-name{color:var(--cyan2)}
.sb-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.sb-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px}
.sb-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:3px}
.sb-name{font-size:12px;font-weight:600;color:var(--text)}
.sb-value{font-size:12px;font-weight:700;color:var(--cyan2)}
.sb-signal{font-size:12px;color:var(--text2)}
.sb-implication{font-size:11px;color:var(--text3);margin-top:2px}
.support{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:24px}
.support-block{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.support-title{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:8px}
.support-row{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:6px}
.support-name{width:120px;flex-shrink:0;color:var(--text2)}
.support-track{flex:1;height:6px;background:var(--border2);border-radius:3px;overflow:hidden}
.support-fill{height:6px;background:var(--text3);border-radius:3px}
.support-fill.top{background:var(--cyan2)}
.support-pct{width:36px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:760px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
th{background:var(--bg2);font-size:11px;font-weight:600;color:var(--text2);letter-spacing:0.04em;text-transform:uppercase}
tr:last-child td{border-bottom:none}
td.num{font-variant-numeric:tabular-nums}
td.hi{background:var(--green-bg);color:var(--green-text);font-weight:600}
td.mid{background:var(--amber-bg);color:var(--amber-text);font-weight:600}
th.sep,td.sep{border-right:2px solid var(--border2)}
tr.few td{color:var(--text3);font-style:italic}
tr.group td{background:var(--bg3);font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--cyan3);padding:6px 12px}
tr.total td{font-weight:600}
tr.total td:not(.hi):not(.mid){background:var(--bg2)}
.key{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:28px;font-size:12px;color:var(--text2)}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{width:14px;height:10px;border-radius:3px;display:inline-block;border:1px solid}
.key .k-hi{background:var(--green-bg);border-color:var(--green-border)}
.key .k-mid{background:var(--amber-bg);border-color:var(--amber-border)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;margin-bottom:28px}
.type-title{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:8px}
.rank{list-style:none}
.rank li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.rank li:last-child{border-bottom:none}
.rank span{color:var(--text3);font-variant-numeric:tabular-nums;flex-shrink:0}
.map-pick{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12px;color:var(--text2)}
.map-pick select{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:8px 12px;color:var(--text);font-size:13px;font-family:var(--font)}
.page-head{margin-bottom:20px}
.page-title{font-size:18px;font-weight:700;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--text3)}
.session-list-rec{font-size:11px;color:var(--teal2);margin-top:3px}
.pools{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:10px;align-items:start}
.pool{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:14px 16px}
.pool-title{font-size:11px;text-transform:uppercase;letter-spacing:0.12em;color:var(--text3);font-weight:700;margin-bottom:8px}
.pool-list{list-style:none}
.pool-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.pool-row:last-child{border-bottom:none}
.pool-row.extra{display:none}
.pool.open .pool-row.extra{display:flex}
.pool-rank{width:18px;flex-shrink:0;font-size:12px;font-weight:700;color:var(--text3);line-height:1.5;font-variant-numeric:tabular-nums}
.pool-row.top .pool-rank{color:var(--cyan2)}
.pool-body{flex:1;min-width:0}
.pool-name{font-size:13px;font-weight:600;color:var(--text);line-height:1.5}
.pool-row.top .pool-name{font-weight:700}
.pool-type{font-size:11px;font-weight:500;color:var(--text3);margin-left:8px}
.pool-meta{font-size:11px;color:var(--text3);line-height:1.5}
.pool-count{font-size:12px;font-weight:600;color:var(--text2);flex-shrink:0;line-height:1.6;font-variant-numeric:tabular-nums}
.pool-note{font-size:13px;color:var(--text2);line-height:1.6}
.pool-more{background:transparent;border:none;padding:8px 0 0;font-family:var(--font);font-size:12px;font-weight:600;color:var(--cyan2);cursor:pointer}
.pool-more:hover{text-decoration:underline}
.pool-more:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.pool-key{font-size:11px;color:var(--text3);margin-bottom:8px}
@media(max-width:760px){
  .header{height:auto;flex-wrap:wrap;padding:10px 16px;gap:8px}
  .header-right{display:none}
  .nav{width:100%;overflow-x:auto}
  .nav-btn{padding:8px 10px;white-space:nowrap}
  .sidebar{padding:0 16px}.content{padding:0 16px 40px}
  .rec-grid,.bio-grid,.sb-grid{grid-template-columns:1fr}
  .lm-grid{grid-template-columns:1fr 1fr}
  .player-banner{flex-direction:column;align-items:flex-start;gap:14px;padding:18px 20px}
  .guide-text{font-size:19px}
}
</style>
</head>

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined && text !== null) e.textContent = text;
  return e;
}
function icon(name) { var i = el('i','ti '+name); i.setAttribute('aria-hidden','true'); return i; }
function clear(node) { while(node.firstChild) node.removeChild(node.firstChild); }
function pct(x) { return Math.round(x*100)+'%'; }
function plural(n, word) { return n+' '+word+(n===1?'':'s'); }
function toast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show '+(type||'success');
  setTimeout(function(){ t.className='toast'; }, 2500);
}
function setDBStatus(connected) {
  var s = document.getElementById('db-status');
  s.textContent = connected ? 'Connected' : 'Offline';
  s.className = 'db-status '+(connected ? 'connected' : 'error');
}
function sectionHeader(title) {
  var h = el('div','section-header');
  h.appendChild(el('div','section-title',title));
  h.appendChild(el('div','section-line'));
  return h;
}
function sizeLabel(n) {
  if(n >= SOLID_N) return 'Fairly solid';
  if(n >= EARLY_N) return 'Early sign';
  return 'Very early';
}
function tally(list, key) {
  var counts = {}, n = 0;
  list.forEach(function(pl){ if(pl[key]) { counts[pl[key]] = (counts[pl[key]]||0)+1; n++; } });
  return {n:n, counts:counts};
}
function share(t, v) { return t.n ? (t.counts[v]||0)/t.n : 0; }
function where(f) {
  var keys = Object.keys(f).filter(function(k){ return f[k]; });
  return PLAYERS.filter(function(pl){ return keys.every(function(k){ return pl[k]===f[k]; }); });
}
// The field for a group: every player with the same traits recorded.
function fieldOf(keys) {
  return PLAYERS.filter(function(pl){ return keys.every(function(k){ return pl[k]; }); });
}

  });

function showPage(page) {
  if(currentPage==='fitting' && document.getElementById('f-name')) saveFittingState();
  currentPage = page;
  buildNav();

  else if(page==='sessions') renderSessions();
  else if(page==='results')  renderResults();
  else if(page==='ironmap')  renderIronMap();
  window.scrollTo(0,0);
}

function rangeOptions(cfg) {
  if(cfg.list) return cfg.list;
  var out = [], n = Math.round((cfg.max-cfg.min)/cfg.step);
  var dec = (String(cfg.step).split('.')[1]||'').length;
  for(var i=0;i<=n;i++){
    var v = +(cfg.min + i*cfg.step).toFixed(dec);
    var txt = v.toFixed(dec);
    if(cfg.signed && v>0) txt = '+'+txt;
    if(v<0) txt = '−'+Math.abs(v).toFixed(dec);
    if(i===0 && cfg.openLow) txt += ' or less';
    if(i===n && cfg.openHigh) txt += ' or more';
    out.push([String(v), txt]);
  }
  return out;
}
function makeRangeSelect(id) {
  var sel = document.createElement('select');
  sel.id = id;
  var blank = el('option',null,'—'); blank.value=''; sel.appendChild(blank);
  rangeOptions(INPUT_RANGES[id]).forEach(function(o){
    var opt = el('option',null,o[1]); opt.value=o[0]; sel.appendChild(opt);
  });
  return sel;
}
function makeListSelect(id, placeholder, names, allowOther) {
  var sel = document.createElement('select');
  sel.id = id;
  var blank = el('option',null,placeholder); blank.value=''; sel.appendChild(blank);
  names.forEach(function(n){ var o = el('option',null,n); o.value=n; sel.appendChild(o); });
  if(allowOther) { var other = el('option',null,'Other / not in the research'); other.value='__other__'; sel.appendChild(other); }
  return sel;
}

function getFittingData() {
  saveFittingState();
  var g = function(id){ var v = fittingState[id]; return v===undefined ? '' : v; };
  var num = function(id){ var v = g(id); return (v===''||isNaN(parseFloat(v))) ? null : parseFloat(v); };
  var d = {
    name:g('f-name'), hdcp:g('f-hdcp'), height:g('f-height'), ball:g('f-ball'),
    grip:fittingState.grip||'', post:fittingState.post||'', leadGrip:fittingState.leadGrip||'', shotShape:fittingState.shotShape||'',
    ss:num('f-ss'), bs:num('f-bs'), la:num('f-la'), sr:num('f-sr'), dl:num('f-dl'), aa:num('f-aa'), cp:num('f-cp'),
    curHead: g('f-curhead')==='__other__' ? g('f-curhead-other') : g('f-curhead'),
    curShaft: g('f-curshaft')==='__other__' ? g('f-curshaft-other') : g('f-curshaft'),
    notes:g('f-notes')
  };
  bioFields.forEach(function(f){ d[f.id] = num('bio-'+f.id); });   // keeps genuine 0 readings
  d.smash = (d.ss>0 && d.bs>0) ? Math.round(d.bs/d.ss*100)/100 : null;
  return d;
}
function clearFitting() {
  fittingState = {grip:'',post:'',leadGrip:'',shotShape:''};
  currentSession = null;
  document.getElementById('session-label').textContent = 'No active session';
  renderFitting();
  window.scrollTo(0,0);
}

// ─── RUN FITTING ─────────────────────────────────────────────────────────────
async function runFitting() {
  var data = getFittingData();
  var recs = buildRecommendations(data);
  currentSession = {data:data, recs:recs};
  document.getElementById('session-label').textContent = data.name || 'Active session';
  showPage('results');
  await saveSession(data, recs);
}

// ─── ENGINE ──────────────────────────────────────────────────────────────────
// Every trait the fitter enters is a signal: the tour players who share it, and how they split
// on each spec. No signal overrides another. Each signal with at least MIN_GROUP players votes
// with its split, and the votes are averaged. Grip and post vote together as the profile when
// the profile has enough players, and separately when it does not.
function traitsOf(d) {
  return {g:d.grip||null, p:d.post||null, lg:d.leadGrip||null, ss:d.shotShape||null, swg:swayGroup(d.swayGap)};
}
function buildSignals(d) {
  var t = traitsOf(d), signals = [];
  function add(kind, label, f) {
    var keys = Object.keys(f);
    signals.push({kind:kind, label:label, keys:keys, list:where(f), field:fieldOf(keys)});
  }
  if(t.g && t.p) {
    var profile = where({g:t.g, p:t.p});
    if(profile.length >= MIN_GROUP) {
      add('profile', PROFILE_NAMES[t.g+'|'+t.p]+' ('+t.g+' / '+t.p+')', {g:t.g, p:t.p});
    } else {
      add('grip', t.g+' grip', {g:t.g});
      add('post', t.p+' post', {p:t.p});
    }
  } else if(t.g) { add('grip', t.g+' grip', {g:t.g}); }
  else if(t.p)   { add('post', t.p+' post', {p:t.p}); }
  if(t.lg)  add('lead',  t.lg+' lead-hand grip', {lg:t.lg});
  if(t.ss)  add('shape', t.ss==='Both' ? 'Works it both ways' : t.ss+' shot shape', {ss:t.ss});
  if(t.swg) add('bio',   t.swg==='Small Gap' ? 'Small iron sway gap' : 'Large iron sway gap', {swg:t.swg});
  return signals;
}
function buildRecommendations(d) {
  var t = traitsOf(d);
  var signals = buildSignals(d);
  var profileKey = (d.grip && d.post) ? d.grip+'|'+d.post : null;
  var profileSmall = profileKey && !signals.some(function(s){ return s.kind==='profile'; });

  // Combine the signals on each spec.
  var specs = {};
  var backing = {};
  SPECS.forEach(function(o){
    var voters = [];
    signals.forEach(function(s){
      var tl = tally(s.list, o.key);
      if(tl.n >= MIN_GROUP) voters.push({signal:s, tally:tl});
    });
    var support = {};
    if(voters.length) {
      o.values.forEach(function(v){
        var sum = 0;
        voters.forEach(function(vt){ sum += share(vt.tally, v); });
        support[v] = sum / voters.length;
      });
      voters.forEach(function(vt){ vt.signal.list.forEach(function(pl){ if(pl[o.key]) backing[pl.n] = true; }); });
    } else {
      var ft = tally(PLAYERS, o.key);
      o.values.forEach(function(v){ support[v] = share(ft, v); });
    }
    var best = 0;
    o.values.forEach(function(v){ if(support[v] > best) best = support[v]; });
    var tops = o.values.filter(function(v){ return best - support[v] < TIE_MARGIN; });
    specs[o.key] = {support:support, tops:tops, voters:voters.length, fieldOnly:!voters.length};
  });
  var backers = Object.keys(backing).length;

  // Guideline line.
  var combo = specs.cb;
  var comboText = combo.tops.length!==1 ? 'combo optional' : combo.tops[0]==='Yes' ? 'combo recommended' : 'one model through the set';
  var guideline = specs.sp.tops.join(' or ')+' + '+specs.ht.tops.map(function(v){ return v.toLowerCase(); }).join(' or ')+', '+comboText;

  // Pools: every model of the recommended type, closest tour matches first.
  function matches(pl) {
    var n = 0;
    ['g','p','lg','ss','swg'].forEach(function(k){ if(t[k] && pl[k]===t[k]) n++; });
    return n;
  }
  function pool(nameKey, typeKey, types) {
    var by = {};
    PLAYERS.forEach(function(pl){
      if(!pl[nameKey] || types.indexOf(pl[typeKey]) < 0) return;
      var m = by[pl[nameKey]] || (by[pl[nameKey]] = {name:pl[nameKey], type:pl[typeKey], players:[], score:0, close:0, best:0, flexes:[]});
      var mc = matches(pl);
      m.players.push({n:pl.n, m:mc});
      m.score += mc;
      if(mc > 0) m.close++;
      if(mc > m.best) m.best = mc;
      if(pl.fx && m.flexes.indexOf(pl.fx) < 0) m.flexes.push(pl.fx);
    });
    return Object.keys(by).map(function(k){ return by[k]; }).sort(function(a,b){
      return b.best-a.best || b.score-a.score || b.players.length-a.players.length || a.name.localeCompare(b.name);
    });
  }
  var heads  = pool('hd','ht',specs.ht.tops);
  var shafts = pool('sh','sp',specs.sp.tops);
  var longBy = {};
  PLAYERS.forEach(function(pl){
    var mc = matches(pl);
    (pl.cms||[]).forEach(function(name){
      var m = longBy[name] || (longBy[name] = {name:name, players:[], score:0, close:0, best:0});
      m.players.push({n:pl.n, m:mc});
      m.score += mc;
      if(mc > 0) m.close++;
      if(mc > m.best) m.best = mc;
    });
  });
  var longIrons = Object.keys(longBy).map(function(k){ return longBy[k]; }).sort(function(a,b){
    return b.best-a.best || b.score-a.score || b.players.length-a.players.length || a.name.localeCompare(b.name);
  });

  // Closest tour matches.
  var entered = ['g','p','lg','ss','swg'].filter(function(k){ return t[k]; }).length;
  var closest = PLAYERS.map(function(pl){ return {pl:pl, m:matches(pl)}; })
    .filter(function(x){ return x.m > 0; })
    .sort(function(a,b){ return b.m-a.m || a.pl.n.localeCompare(b.pl.n); });

  // SportsBox read-out, one line per variable.
  var sportsbox = [];
  if(d.swayGap !== null && d.swayGap !== undefined) {
    var sg = where({swg:t.swg}), st = tally(sg,'sp'), top = null;
    SPECS[0].values.forEach(function(v){ if(top===null || (st.counts[v]||0) > (st.counts[top]||0)) top = v; });
    sportsbox.push({name:'Sway Gap', value:d.swayGap+'"', signal:(t.swg==='Small Gap'?'Small gap (above ':'Large gap (at or below ')+SWAY_SPLIT+'")',
      implication: st.n ? (st.counts[top]||0)+' of '+st.n+' tour players in this group play '+top.toLowerCase()+' irons' : 'No tour players in this group yet'});
  }
  [['chestLift','Chest Lift','"'],['leadElbow','Lead Elbow','°'],['clubHandGap','Club Hand Gap','"'],['pelvisSway','Pelvis Sway','"']].forEach(function(b){
    if(d[b[0]] !== null && d[b[0]] !== undefined) sportsbox.push({name:b[1], value:d[b[0]]+b[2], signal:'Recorded', implication:'No iron tour data yet, so no adjustment'});
  });

  return {profileKey:profileKey, profileSmall:profileSmall, traits:t, entered:entered, signals:signals, specs:specs,
          guideline:guideline, backers:backers, heads:heads, shafts:shafts, longIrons:longIrons, closest:closest, sportsbox:sportsbox};
}

var POOL_LIMIT = 5;   // rows shown before "Show all"
function namesOf(item, max) {
  var sorted = item.players.slice().sort(function(a,b){ return b.m-a.m || a.n.localeCompare(b.n); });
  var names = sorted.map(function(p){ return p.n; });
  return names.slice(0,max).join(', ')+(names.length>max ? ' +'+(names.length-max)+' more' : '');
}
// One compact pool: a short ranked list, with the rest behind "Show all".
function poolList(title, items, kind, entered) {
  var box = el('div','pool');
  box.appendChild(el('div','pool-title',title));
  if(!items.length) { box.appendChild(el('div','pool-note','None in the research yet.')); return box; }
  var list = el('ol','pool-list');
  items.forEach(function(it, i){
    var li = el('li','pool-row'+(i===0?' top':'')+(i>=POOL_LIMIT?' extra':''));
    li.appendChild(el('span','pool-rank',String(i+1)));
    var body = el('div','pool-body');
    var name = el('div','pool-name',it.name);
    if(kind==='head' && it.type) name.appendChild(el('span','pool-type',it.type==='Cavity Back' ? 'Cavity back' : it.type));
    if(kind==='shaft' && it.flexes.length) name.appendChild(el('span','pool-type','Tour flex '+it.flexes.join(', ')));
    body.appendChild(name);
    var meta = namesOf(it,2);
    if(entered && it.best) meta += ' · shares '+it.best+' of '+entered+(entered===1?' trait':' traits');
    body.appendChild(el('div','pool-meta',meta));
    li.appendChild(body);
    li.appendChild(el('span','pool-count',String(it.players.length)));
    list.appendChild(li);
  });
  box.appendChild(list);
  if(items.length > POOL_LIMIT) {
    var more = el('button','pool-more','Show all '+items.length);
    more.type = 'button';
    more.setAttribute('aria-expanded','false');
    more.addEventListener('click', function(){
      var open = box.classList.toggle('open');
      more.textContent = open ? 'Show top '+POOL_LIMIT : 'Show all '+items.length;
      more.setAttribute('aria-expanded', open?'true':'false');
    });
    box.appendChild(more);
  }
  return box;
}

  }
  if(recs.profileSmall) {
    var small = el('div','rule-item');
    small.appendChild(icon('ti-chevron-right'));
    small.appendChild(el('span',null,PROFILE_NAMES[recs.profileKey]+' has fewer than '+MIN_GROUP+' tour players, so grip and post are counted as two separate signals.'));
    strip.appendChild(small);
  }
  recs.signals.forEach(function(s){
    var item = el('div','rule-item');
    item.appendChild(icon(s.kind==='bio' ? 'ti-activity' : 'ti-hand-finger'));
    var span = el('span');
    span.appendChild(el('strong','signal-name',s.label+': '));
    if(s.list.length < MIN_GROUP) {
      span.appendChild(document.createTextNode(plural(s.list.length,'tour player')+', too few to count toward the guideline.'));
    } else {
      var bits = SPECS.map(function(o){
        var tl = tally(s.list,o.key);
        if(tl.n < MIN_GROUP) return null;
        var top = o.values.slice().sort(function(a,b){ return (tl.counts[b]||0)-(tl.counts[a]||0); })[0];
        var diff = share(tl,top) - share(tally(s.field,o.key),top);
        var flag = diff >= BIG ? ' (big difference)' : diff >= LOOK ? ' (worth a look)' : '';
        return (tl.counts[top]||0)+' of '+tl.n+' '+specName(o,top).toLowerCase()+flag;
      }).filter(Boolean);
      span.appendChild(document.createTextNode(bits.join(' · ')+'. '+sizeLabel(s.list.length)+', '+plural(s.list.length,'player')+'.'));
    }
    item.appendChild(span);
    strip.appendChild(item);
  });
  inner.appendChild(strip);

  // SportsBox analysis
  if(recs.sportsbox.length) {
    inner.appendChild(sectionHeader('SportsBox analysis'));
    var sbGrid = el('div','sb-grid');
    recs.sportsbox.forEach(function(s){
      var card = el('div','sb-card');
      var top = el('div','sb-top');
      top.appendChild(el('span','sb-name',s.name));
      top.appendChild(el('span','sb-value',s.value));
      card.appendChild(top);
      card.appendChild(el('div','sb-signal',s.signal));
      card.appendChild(el('div','sb-implication',s.implication));
      sbGrid.appendChild(card);
    });
    inner.appendChild(sbGrid);
  }

  // How the signals combine
  inner.appendChild(sectionHeader('How the signals combine'));
  inner.appendChild(el('div','plain-note','Each signal with at least '+MIN_GROUP+' tour players votes with its own split, and the votes are averaged. No signal overrides another.'));
  var combine = el('div','support');
  SPECS.forEach(function(o){
    var s = recs.specs[o.key];
    var block = el('div','support-block');
    block.appendChild(el('div','support-title',o.label+(s.fieldOnly ? ' — all tour players' : ' — '+plural(s.voters,'signal'))));
    o.values.forEach(function(v){
      var row = el('div','support-row');
      row.appendChild(el('div','support-name',specName(o,v)));
      var track = el('div','support-track'), fill = el('div','support-fill'+(s.tops.indexOf(v)>=0?' top':''));
      fill.style.width = Math.round(s.support[v]*100)+'%';
      track.appendChild(fill);
      row.appendChild(track);
      row.appendChild(el('div','support-pct',pct(s.support[v])));
      block.appendChild(row);
    });
    combine.appendChild(block);
  });
  inner.appendChild(combine);

  // Closest tour matches
  if(recs.closest.length) {
    inner.appendChild(sectionHeader('Closest tour matches'));
    var scroll = el('div','scroll'), table = el('table');
    var thead = el('thead'), hr = el('tr');
    ['Player','Traits shared','Shaft','Profile','Flex','Head','Type','Long-iron combo'].forEach(function(h){ var th = el('th',null,h); th.scope='col'; hr.appendChild(th); });
    thead.appendChild(hr); table.appendChild(thead);
    var tb = el('tbody');
    recs.closest.slice(0,15).forEach(function(x){
      var pl = x.pl, tr = el('tr');
      var combo = pl.cb==='Yes' ? (pl.cm||'Yes') : pl.cb==='No' ? 'No' : null;
      [pl.n, x.m+' of '+recs.entered, pl.sh, pl.sp, pl.fx, pl.hd, pl.ht, combo].forEach(function(v){ tr.appendChild(el('td',null,v||'–')); });
      tb.appendChild(tr);
    });
    table.appendChild(tb); scroll.appendChild(table);
    inner.appendChild(scroll);
  }
  content.appendChild(zone2);
}

// ─── SESSIONS ────────────────────────────────────────────────────────────────
async function saveSession(d, recs) {
  if(!db) { toast('Database unavailable — session not saved','error'); return; }
  var row = {
    club:CLUB,
    player_name:d.name||null, handicap:d.hdcp||null, height:d.height||null,
    current_gamer:[d.curHead,d.curShaft].filter(Boolean).join(' / ')||null,
    swing_speed:d.ss, ball_speed:d.bs, launch_angle:d.la, spin_rate:d.sr, attack_angle:d.aa, club_path:d.cp,
    smash_factor:d.smash, dynamic_loft:d.dl,
    sway_gap:d.swayGap, chest_lift:d.chestLift, lead_elbow:d.leadElbow, club_hand_gap:d.clubHandGap, pelvis_sway:d.pelvisSway,
    grip:d.grip||null, post:d.post||null, shot_shape:d.shotShape||null, lead_grip:d.leadGrip||null,
    notes:d.notes||null,
    recommendations:JSON.stringify({club:CLUB, guideline:recs.guideline, ball:d.ball||null, curHead:d.curHead||null, curShaft:d.curShaft||null,
      heads:recs.heads.slice(0,3).map(function(h){ return h.name; }), shafts:recs.shafts.slice(0,3).map(function(s){ return s.name; })})
  };
  try {
    var result = await db.from('sessions').insert(row);
    if(result.error) { toast('Could not save session','error'); return; }
    toast('Session saved');
    await loadSessions();
  } catch(err) { toast('Could not save session','error'); }
}
function parseRecs(s) {
  if(!s.recommendations) return {};
  try { return typeof s.recommendations==='string' ? JSON.parse(s.recommendations) : s.recommendations; } catch(e) { return {}; }
}
function renderSessions() {
  var sidebar = document.getElementById('sidebar');
  var content = document.getElementById('content');
  clear(sidebar); clear(content);

  var sec = el('div','sidebar-section');
  sec.appendChild(makeSidebarLabel('Past sessions'));
  sec.appendChild(el('div',null,plural(sessionsList.length,'iron session')+' saved.'));
  sidebar.appendChild(sec);

  if(!sessionsList.length) {
    var empty = el('div','empty');
    empty.appendChild(icon('ti-history'));
    empty.appendChild(el('div','empty-title','No sessions yet'));
    empty.appendChild(el('div','empty-sub', db ? 'Sessions are saved automatically after each fitting.' : 'The database is unavailable, so past sessions cannot be loaded.'));
    content.appendChild(empty);
    return;
  }
  var hdr = el('div','page-head');
  hdr.appendChild(el('div','page-title','Iron fitting sessions'));
  hdr.appendChild(el('div','page-sub',plural(sessionsList.length,'session')+' saved.'));
  content.appendChild(hdr);

  sessionsList.forEach(function(s){
    var item = el('div','session-list-item');
    item.tabIndex = 0;
    item.setAttribute('role','button');
    var info = el('div');
    info.appendChild(el('div','session-list-name',s.player_name||'Unnamed player'));
    var profile = (s.grip&&s.post) ? PROFILE_NAMES[s.grip+'|'+s.post] : '';
    info.appendChild(el('div','session-list-meta',[profile,'Hdcp '+(s.handicap||'—'),new Date(s.created_at).toLocaleDateString()].filter(Boolean).join(' · ')));
    var rec = parseRecs(s);
    if(rec.guideline) info.appendChild(el('div','session-list-rec',rec.guideline));
    item.appendChild(info);
    var delBtn = el('button','btn-sm danger');
    delBtn.type = 'button';
    delBtn.setAttribute('aria-label','Delete session');
    delBtn.appendChild(icon('ti-trash'));
    delBtn.addEventListener('click', function(e){ e.stopPropagation(); deleteSession(s.id); });
    item.appendChild(delBtn);
    item.addEventListener('click', function(){ loadSession(s.id); });
    item.addEventListener('keydown', function(e){ if(e.target===item && (e.key==='Enter'||e.key===' ')) { e.preventDefault(); loadSession(s.id); } });
    content.appendChild(item);
  });
}
function numOrNull(v) { return (v===null||v===undefined||v==='') ? null : parseFloat(v); }
function loadSession(id) {
  var s = sessionsList.find(function(x){ return x.id===id; });
  if(!s) return;
  var rec = parseRecs(s);
  var d = {
    name:s.player_name||'', hdcp:s.handicap||'', height:s.height||'', ball:rec.ball||'',
    grip:s.grip||'', post:s.post||'', leadGrip:s.lead_grip||'', shotShape:s.shot_shape||'',
    ss:numOrNull(s.swing_speed), bs:numOrNull(s.ball_speed), la:numOrNull(s.launch_angle), sr:numOrNull(s.spin_rate),
    dl:numOrNull(s.dynamic_loft), aa:numOrNull(s.attack_angle), cp:numOrNull(s.club_path), smash:numOrNull(s.smash_factor),
    swayGap:numOrNull(s.sway_gap), chestLift:numOrNull(s.chest_lift), leadElbow:numOrNull(s.lead_elbow),
    clubHandGap:numOrNull(s.club_hand_gap), pelvisSway:numOrNull(s.pelvis_sway),
    curHead:rec.curHead||'', curShaft:rec.curShaft||'', notes:s.notes||''
  };
  currentSession = {data:d, recs:buildRecommendations(d)};
  document.getElementById('session-label').textContent = d.name||'Loaded session';
  showPage('results');
}
async function deleteSession(id) {
  if(!db || !confirm('Delete this session?')) return;
  var result = await db.from('sessions').delete().eq('id',id).eq('club',CLUB);
  if(!result.error) { sessionsList = sessionsList.filter(function(s){ return s.id!==id; }); toast('Session deleted'); renderSessions(); }
  else toast('Could not delete','error');
}

// ─── IRON MAP ────────────────────────────────────────────────────────────────
// Iron Map cell colours: over 60% green, 40-60% yellow, on the percentage as displayed.
function shareClass(x) {
  var p = Math.round(x*100);
  return p > 60 ? 'hi' : p >= 40 ? 'mid' : '';
}
function traitRow(label, list, cls) {
  var tr = el('tr', cls||'');
  tr.appendChild(el('td',null,label));
  tr.appendChild(el('td','num',String(list.length)));
  var few = list.length < MIN_GROUP;
  if(few) tr.className += ' few';
  SPECS.forEach(function(o, oi){
    var tl = tally(list,o.key);
    o.values.forEach(function(v, vi){
      var td = el('td','num');
      if(vi===o.values.length-1 && oi<SPECS.length-1) td.className += ' sep';
      if(!tl.n) td.textContent = '–';
      else {
        td.textContent = (tl.counts[v]||0)+' of '+tl.n+' · '+pct(share(tl,v));
        if(!few) { var sc = shareClass(share(tl,v)); if(sc) td.className += ' '+sc; }
      }
      tr.appendChild(td);
    });
  });
  return tr;
}
function typeList(title, nameKey, typeKey, type) {
  var by = {};
  PLAYERS.forEach(function(pl){
    if(!pl[nameKey]) return;
    if((pl[typeKey]||null) !== type) return;
    (by[pl[nameKey]] = by[pl[nameKey]] || []).push(pl.n);
  });
  var names = Object.keys(by).sort(function(a,b){ return by[b].length-by[a].length || a.localeCompare(b); });
  var box = el('div','type-box');
  box.appendChild(el('div','type-title',title+' ('+names.length+')'));
  if(!names.length) { box.appendChild(el('div','plain-note','None.')); return box; }
  var ul = el('ul','rank');
  names.forEach(function(n){
    var li = el('li');
    li.appendChild(document.createTextNode(n));
    li.appendChild(el('span',null,String(by[n].length)));
    li.title = by[n].join(', ');
    ul.appendChild(li);
  });
  box.appendChild(ul);
  return box;
}
function renderIronMap() {
  var sidebar = document.getElementById('sidebar');
  var content = document.getElementById('content');
  clear(sidebar); clear(content);

  var sec = el('div','sidebar-section');
  sec.appendChild(makeSidebarLabel('Iron map'));
  function count(k){ return PLAYERS.filter(function(pl){ return pl[k]; }).length; }
  sec.appendChild(el('div','section-note',PLAYERS.length+' tour players in the research. Grip is recorded for '+count('g')+', post for '+count('p')+', lead-hand grip for '+count('lg')+', iron shot shape for '+count('ss')+' and iron sway gap for '+count('swg')+'.'));
  sidebar.appendChild(sec);

  // Trait table
  content.appendChild(sectionHeader('How each trait splits'));
  var scroll = el('div','scroll'), table = el('table');
  var thead = el('thead'), hr = el('tr');
  ['Group','Players','Tip-stiff','Mid-stiff','Butt-stiff','Blade','Cavity back','Long-iron combo','One model'].forEach(function(h){ var th = el('th',(h==='Butt-stiff'||h==='Cavity back')?'sep':null,h); th.scope='col'; hr.appendChild(th); });
  thead.appendChild(hr); table.appendChild(thead);
  var tb = el('tbody');
  function groupRow(text){ var g = el('tr','group'), c = el('td',null,text); c.colSpan = 9; g.appendChild(c); tb.appendChild(g); }
  groupRow('Profile (grip / post)');
  PROFILE_KEYS.forEach(function(k){
    var parts = k.split('|');
    tb.appendChild(traitRow(PROFILE_NAMES[k]+' · '+parts[0]+' / '+parts[1], where({g:parts[0],p:parts[1]})));
  });
  TRAITS.forEach(function(trait){
    groupRow(trait.name);
    trait.values.forEach(function(v){
      var f = {}; f[trait.key] = v;
      tb.appendChild(traitRow(v, where(f)));
    });
  });
  tb.appendChild(traitRow('All players', PLAYERS, 'total'));
  table.appendChild(tb); scroll.appendChild(table);
  content.appendChild(scroll);
  var key = el('div','key');
  [['k-hi','Over 60%'],['k-mid','40% to 60%']].forEach(function(k){
    var s = el('span'); s.appendChild(el('i',k[0])); s.appendChild(document.createTextNode(k[1])); key.appendChild(s);
  });
  key.appendChild(el('span',null,'Grey italic: fewer than '+MIN_GROUP+' players'));
  content.appendChild(key);

  // Equipment by type
  content.appendChild(sectionHeader('Iron heads by type'));
  var hcols = el('div','cols');
  hcols.appendChild(typeList('Blades','hd','ht','Blade'));
  hcols.appendChild(typeList('Cavity backs','hd','ht','Cavity Back'));
  hcols.appendChild(typeList('No type on the sheet yet','hd','ht',null));
  content.appendChild(hcols);
  content.appendChild(sectionHeader('Iron shafts by profile'));
  var scols = el('div','cols');
  scols.appendChild(typeList('Tip-stiff','sh','sp','Tip-stiff'));
  scols.appendChild(typeList('Mid-stiff','sh','sp','Mid-stiff'));
  scols.appendChild(typeList('Butt-stiff','sh','sp','Butt-stiff'));
  scols.appendChild(typeList('No profile on the sheet yet','sh','sp',null));
  content.appendChild(scols);

  // Long-iron combo models
  content.appendChild(sectionHeader('Long-iron combo models'));
  var lby = {};
  PLAYERS.forEach(function(pl){ (pl.cms||[]).forEach(function(n){ (lby[n] = lby[n] || []).push(pl.n); }); });
  var lnames = Object.keys(lby).sort(function(x,y){ return lby[y].length-lby[x].length || x.localeCompare(y); });
  var lbox = el('div','cols');
  [lnames.slice(0, Math.ceil(lnames.length/2)), lnames.slice(Math.ceil(lnames.length/2))].forEach(function(half){
    var ul = el('ul','rank');
    half.forEach(function(n){
      var li = el('li');
      li.appendChild(document.createTextNode(n));
      li.appendChild(el('span',null,String(lby[n].length)));
      li.title = lby[n].join(', ');
      ul.appendChild(li);
    });
    lbox.appendChild(ul);
  });
  content.appendChild(lbox);

  // Players, filtered by profile
  content.appendChild(sectionHeader('Tour players'));
  var pick = el('div','map-pick');
  var lbl = el('label',null,'Profile'); lbl.htmlFor = 'map-profile';
  pick.appendChild(lbl);
  var sel = document.createElement('select'); sel.id = 'map-profile';
  var all = el('option',null,'All players'); all.value='ALL'; sel.appendChild(all);
  PROFILE_KEYS.forEach(function(k){ var o = el('option',null,PROFILE_NAMES[k]+' — '+k.replace('|',' / ')); o.value=k; sel.appendChild(o); });
  sel.value = mapProfile;
  pick.appendChild(sel);
  content.appendChild(pick);
  var pwrap = el('div','scroll'); pwrap.id = 'map-players';
  content.appendChild(pwrap);
  sel.addEventListener('change', function(){ mapProfile = sel.value; renderMapPlayers(); });
  renderMapPlayers();
}
function renderMapPlayers() {
  var wrap = document.getElementById('map-players');
  clear(wrap);
  var list = PLAYERS;
  if(mapProfile !== 'ALL') { var parts = mapProfile.split('|'); list = where({g:parts[0],p:parts[1]}); }
  if(!list.length) { wrap.appendChild(el('div','plain-note pad','No tour players in this profile yet.')); return; }
  var table = el('table'), thead = el('thead'), hr = el('tr');
  ['Player','Grip','Post','Lead hand','Shot shape','Sway gap','Shaft','Profile','Flex','Head','Type','Long-iron combo'].forEach(function(h){ var th = el('th',null,h); th.scope='col'; hr.appendChild(th); });
  thead.appendChild(hr); table.appendChild(thead);
  var tb = el('tbody');
  list.forEach(function(pl){
    var tr = el('tr');
    var combo = pl.cb==='Yes' ? (pl.cm||'Yes')+(pl.cn?' ('+pl.cn+')':'') : pl.cb==='No' ? 'No' : null;
    [pl.n,pl.g,pl.p,pl.lg,pl.ss,pl.sw!==null&&pl.sw!==undefined?String(pl.sw):null,pl.sh,pl.sp,pl.fx,pl.hd,pl.ht,combo].forEach(function(v){ tr.appendChild(el('td',null,v||'–')); });
    tb.appendChild(tr);
  });
  table.appendChild(tb);
  wrap.appendChild(table);
}

// ─── START ───────────────────────────────────────────────────────────────────
buildNav();
renderFitting();
loadSessions().then(function(){ if(currentPage==='sessions') renderSessions(); });
